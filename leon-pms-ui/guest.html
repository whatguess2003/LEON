<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your details - Ella</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    #messages { background-color: #efeae2; background-image: radial-gradient(#e4dcd0 1.2px, transparent 1.2px); background-size: 16px 16px; }
  </style>
</head>
<body class="h-full bg-white text-gray-900">
  <main class="h-full flex flex-col">
    <header class="border-b border-gray-200 px-4 py-3">
      <div class="max-w-3xl mx-auto flex items-center">
        <div class="w-8 h-8 rounded-full bg-teal-600 text-white flex items-center justify-center text-sm font-semibold flex-shrink-0">E</div>
        <div class="ml-3">
          <div class="text-sm font-semibold">Ella</div>
          <div id="progress" class="text-xs text-gray-500">Open the link from WhatsApp</div>
        </div>
      </div>
    </header>
    <div class="flex-1 flex flex-col md:flex-row min-h-0">
      <section class="flex-1 flex flex-col min-h-0">
        <div id="messages" class="flex-1 overflow-y-auto px-4 py-6"></div>
        <form id="composer" class="border-t border-gray-200 px-4 py-3">
          <div id="suggestion-row" class="max-w-3xl mx-auto mb-2"></div>
          <div class="max-w-3xl mx-auto flex items-end">
            <textarea id="input" rows="1" placeholder="Message Ella" class="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm resize-none max-h-40"></textarea>
            <button id="send" type="submit" class="ml-2 bg-teal-600 text-white rounded-lg px-4 py-2 text-sm flex-shrink-0">Send</button>
          </div>
        </form>
      </section>
      <aside class="w-full md:w-64 border-t md:border-t-0 md:border-l border-gray-200 p-3 overflow-y-auto order-first md:order-last flex-shrink-0">
        <h2 class="text-xs font-semibold text-gray-700">To-do</h2>
        <div id="todos" class="mt-2"></div>
        <h2 class="text-xs font-semibold text-gray-700 mt-4">Your details</h2>
        <div id="highlights" class="mt-2"></div>
      </aside>
    </div>
  </main>
  <script src="js/components/guest-onboard.js?v=ella"></script>
</body>
</html>
