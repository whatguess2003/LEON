<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your details - LEON</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <script src="js/data/countries_iso3166.js"></script>
</head>
<body class="bg-gray-50" style="font-family: Inter, sans-serif;">
    <main class="max-w-lg mx-auto px-4 py-8">
        <h1 class="text-2xl font-semibold text-gray-900">Your details</h1>
        <p id="guest-note" class="text-sm text-gray-600 mt-2">Open the link from WhatsApp to fill in your details.</p>
        <form id="guest-form" class="hidden mt-6 bg-white border rounded p-4 space-y-3">
            <label class="block text-sm text-gray-700">Phone<input id="g-phone" class="border rounded w-full px-2 py-1 mt-1 bg-gray-100" disabled></label>
            <label class="block text-sm text-gray-700">Name<input id="g-name" class="border rounded w-full px-2 py-1 mt-1"></label>
            <label class="block text-sm text-gray-700">Email<input id="g-email" type="email" class="border rounded w-full px-2 py-1 mt-1"></label>
            <label class="block text-sm text-gray-700">Country<select id="g-country" class="border rounded w-full px-2 py-1 mt-1"></select></label>
            <label class="block text-sm text-gray-700">Date of birth<input id="g-dob" type="date" class="border rounded w-full px-2 py-1 mt-1"></label>
            <label class="block text-sm text-gray-700">Gender<select id="g-gender" class="border rounded w-full px-2 py-1 mt-1"></select></label>
            <label class="block text-sm text-gray-700">Company<input id="g-company" class="border rounded w-full px-2 py-1 mt-1"></label>
            <label class="block text-sm text-gray-700">Address<input id="g-address" class="border rounded w-full px-2 py-1 mt-1"></label>
            <label class="block text-sm text-gray-700">ID type<select id="g-id-type" class="border rounded w-full px-2 py-1 mt-1"></select></label>
            <label class="block text-sm text-gray-700">ID number<input id="g-id-number" class="border rounded w-full px-2 py-1 mt-1"></label>
            <label class="block text-sm text-gray-700">Special request<textarea id="g-request" rows="3" class="border rounded w-full px-2 py-1 mt-1"></textarea></label>
            <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded">Save</button>
            <p class="text-sm text-gray-600">Saving opens WhatsApp so you can message the hotel.</p>
            <p id="guest-status" class="text-sm"></p>
        </form>
    </main>
    <script>
        const api = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
            ? 'http://localhost:8002/api'
            : 'https://api.inap.ai/api';
        const token = new URLSearchParams(location.search).get('t') || '';
        const note = document.getElementById('guest-note');
        const form = document.getElementById('guest-form');
        const status = document.getElementById('guest-status');

        function fillSelect(id, choices, current) {
            const select = document.getElementById(id);
            const first = document.createElement('option');
            first.value = '';
            first.textContent = '';
            select.appendChild(first);
            choices.forEach(choice => {
                const option = document.createElement('option');
                option.value = choice;
                option.textContent = choice;
                if (choice === current) option.selected = true;
                select.appendChild(option);
            });
        }

        function show(guest) {
            note.textContent = 'Complete your profile for ' + (guest.hotel_name || 'your stay') + '.';
            document.getElementById('g-phone').value = guest.guest_phone || '';
            document.getElementById('g-name').value = guest.guest_name || '';
            document.getElementById('g-email').value = guest.email || '';
            document.getElementById('g-dob').value = guest.date_of_birth || '';
            document.getElementById('g-company').value = guest.company || '';
            document.getElementById('g-address').value = guest.address || '';
            document.getElementById('g-id-number').value = guest.identity_number || '';
            document.getElementById('g-request').value = guest.special_request || '';
            fillSelect('g-country', (window.COUNTRIES_ISO3166 || []).map(row => row.name), guest.country || '');
            fillSelect('g-gender', ['Male', 'Female'], guest.gender || '');
            fillSelect('g-id-type', ['IC', 'MyKad', 'Passport'], guest.identity_type || '');
            form.classList.remove('hidden');
        }

        async function load() {
            if (!token) return;
            note.textContent = 'Loading your details...';
            const response = await fetch(api + '/guest/biography?token=' + encodeURIComponent(token));
            const data = await response.json();
            if (!response.ok || data.error) {
                note.textContent = data.error || 'Could not open your details';
                return;
            }
            show(data);
        }

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            status.textContent = 'Saving...';
            const response = await fetch(api + '/guest/biography', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    token: token,
                    guest_name: document.getElementById('g-name').value,
                    email: document.getElementById('g-email').value,
                    country: document.getElementById('g-country').value,
                    date_of_birth: document.getElementById('g-dob').value,
                    gender: document.getElementById('g-gender').value,
                    company: document.getElementById('g-company').value,
                    address: document.getElementById('g-address').value,
                    identity_type: document.getElementById('g-id-type').value,
                    identity_number: document.getElementById('g-id-number').value,
                    special_request: document.getElementById('g-request').value
                })
            });
            const data = await response.json();
            if (!response.ok || data.error) {
                status.textContent = data.error || 'Could not save';
                return;
            }
            if (data.whatsapp_url) {
                status.textContent = 'Opening WhatsApp...';
                window.location.assign(data.whatsapp_url);
                return;
            }
            status.textContent = 'Saved';
        });

        load();
    </script>
</body>
</html>
