<!DOCTYPE html>
<html lang="en">
<head>
    <script src="js/session.js?v=hotel"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Housekeeping - LEON PMS</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="css/modern-pms.css" rel="stylesheet">
</head>
<body class="bg-gray-50">
  <div id="app" class="min-h-screen">
    <nav class="bg-white shadow-lg border-b border-gray-200">
      <div class="w-full px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center h-16">
          <div class="flex items-center">
            <div class="flex-shrink-0 flex items-center">
              <i class="fas fa-broom text-2xl text-green-600 mr-3"></i>
              <h1 class="text-xl font-bold text-gray-900">LEON PMS</h1>
            </div>
          </div>
          <div class="hidden md:block">
            <div class="ml-10 flex items-baseline space-x-4">
              <a href="index.html" class="text-gray-600 hover:text-gray-900 px-3 py-2 rounded-md text-sm font-medium transition-colors">
                <i class="fas fa-home mr-2"></i>Home
              </a>
              <a href="dashboard.html" class="text-gray-600 hover:text-gray-900 px-3 py-2 rounded-md text-sm font-medium transition-colors">
                <i class="fas fa-tachometer-alt mr-2"></i>Dashboard
              </a>
              <a href="rooms.html" class="text-gray-600 hover:text-gray-900 px-3 py-2 rounded-md text-sm font-medium transition-colors">
                <i class="fas fa-bed mr-2"></i>Rooms
              </a>
              <a href="housekeeping.html" class="bg-blue-100 text-blue-700 px-3 py-2 rounded-md text-sm font-medium transition-colors">
                <i class="fas fa-broom mr-2"></i>Housekeeping
              </a>
              <a href="bookings.html" class="text-gray-600 hover:text-gray-900 px-3 py-2 rounded-md text-sm font-medium transition-colors">
                <i class="fas fa-calendar-check mr-2"></i>Bookings
              </a>
              <a href="analytics.html" class="text-gray-600 hover:text-gray-900 px-3 py-2 rounded-md text-sm font-medium transition-colors">
                <i class="fas fa-chart-line mr-2"></i>Analytics
              </a>
            </div>
          </div>
        </div>
      </div>
    </nav>

    <main class="w-full px-4 sm:px-6 lg:px-8 py-4">
      <div class="flex items-center justify-between mb-6">
        <div>
          <h1 class="text-3xl font-bold text-gray-900">Housekeeping</h1>
          <p class="text-gray-600 mt-1">Live status of rooms, staff assignments, and cleaning progress</p>
        </div>
        <div class="flex gap-3">
          <input type="date" id="hk-date" class="border rounded-lg px-3 py-2" />
          <select id="hk-shift" class="border rounded-lg px-3 py-2">
            <option value="all">All Shifts</option>
            <option value="morning">Morning</option>
            <option value="evening">Evening</option>
            <option value="night">Night</option>
          </select>
          <select id="hk-staff" class="border rounded-lg px-3 py-2">
            <option value="all">All Staff</option>
          </select>
        </div>
      </div>

      <!-- KPI Cards -->
      <div class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-8">
        <div class="card p-4 text-center"><div class="text-2xl font-bold text-orange-600" id="kpi-dirty">-</div><div class="text-sm text-gray-600">Dirty</div></div>
        <div class="card p-4 text-center"><div class="text-2xl font-bold text-gray-700" id="kpi-assigned">-</div><div class="text-sm text-gray-600">Assigned</div></div>
        <div class="card p-4 text-center"><div class="text-2xl font-bold text-yellow-600" id="kpi-in-progress">-</div><div class="text-sm text-gray-600">In Progress</div></div>
        <div class="card p-4 text-center"><div class="text-2xl font-bold text-indigo-600" id="kpi-quality-check">-</div><div class="text-sm text-gray-600">Quality Check</div></div>
        <div class="card p-4 text-center"><div class="text-2xl font-bold text-green-600" id="kpi-completed">-</div><div class="text-sm text-gray-600">Completed</div></div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- Kanban Board -->
        <div class="lg:col-span-2 card p-4">
          <div class="grid grid-cols-5 gap-4" id="hk-kanban">
            <div>
              <h3 class="font-semibold text-gray-800 mb-2 flex items-center"><span class="w-2 h-2 bg-orange-500 rounded-full mr-2"></span>Dirty</h3>
              <div class="space-y-3 min-h-[200px]" id="col-dirty"></div>
            </div>
            <div>
              <h3 class="font-semibold text-gray-800 mb-2 flex items-center"><span class="w-2 h-2 bg-gray-500 rounded-full mr-2"></span>Assigned</h3>
              <div class="space-y-3 min-h-[200px]" id="col-assigned"></div>
            </div>
            <div>
              <h3 class="font-semibold text-gray-800 mb-2 flex items-center"><span class="w-2 h-2 bg-yellow-500 rounded-full mr-2"></span>In Progress</h3>
              <div class="space-y-3 min-h-[200px]" id="col-in-progress"></div>
            </div>
            <div>
              <h3 class="font-semibold text-gray-800 mb-2 flex items-center"><span class="w-2 h-2 bg-indigo-500 rounded-full mr-2"></span>Quality Check</h3>
              <div class="space-y-3 min-h-[200px]" id="col-quality-check"></div>
            </div>
            <div>
              <h3 class="font-semibold text-gray-800 mb-2 flex items-center"><span class="w-2 h-2 bg-green-500 rounded-full mr-2"></span>Completed</h3>
              <div class="space-y-3 min-h-[200px]" id="col-completed"></div>
            </div>
          </div>
        </div>

        <!-- Staff Workload -->
        <div class="card p-4">
          <div class="flex items-center justify-between mb-3">
            <h3 class="font-semibold text-gray-800">Staff Workload</h3>
            <button id="assign-auto" class="text-xs bg-blue-600 text-white px-3 py-1 rounded">Auto-Assign</button>
          </div>
          <div id="hk-staff-list" class="space-y-3"></div>
        </div>
      </div>

      <!-- Activity Timeline -->
      <div class="card p-4 mt-6">
        <div class="flex items-center justify-between mb-3">
          <h3 class="font-semibold text-gray-800">Live Activity</h3>
          <div class="text-xs text-gray-500" id="hk-last-updated">-</div>
        </div>
        <div id="hk-activity" class="space-y-2"></div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  <script src="js/components/housekeeping.js?v=hotel"></script>
  <script src="js/subpage-embed.js"></script>
</body>
</html>
