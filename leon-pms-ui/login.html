<!DOCTYPE html>
<html lang="en">
<head>
    <script src="js/session.js?v=persist"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEON PMS - Manager Authentication</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/modern-pms.css">
    <script src="js/data/country_codes.js"></script>
    <script src="js/data/languages_iso639.js"></script>
    <script src="js/data/countries_iso3166.js"></script>
    <script src="https://twemoji.maxcdn.com/v/latest/twemoji.min.js" crossorigin="anonymous"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'sans': ['Inter', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-white to-purple-50 min-h-screen">
    <!-- Authentication App -->
    <div x-data="authApp()" x-init="init()" class="min-h-screen flex items-center justify-center p-4">
        <!-- Main Auth Container -->
        <div class="glass-card w-full max-w-md">
            <div class="p-8">
                <!-- Header -->
                <div class="text-center mb-8">
                    <div class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-r from-indigo-500 to-purple-600 rounded-full mb-4">
                        <i class="fas fa-hotel text-white text-2xl"></i>
                    </div>
                    <h1 class="text-xl font-bold text-gray-800 mb-2">LEON PMS</h1>
                    <p class="text-gray-600">Hotel Management System</p>
                </div>

                <!-- Auth Toggle -->
                <div class="flex mb-8 bg-gray-100 rounded-lg p-1">
                    <button @click="authMode = 'signin'" 
                            :class="authMode === 'signin' ? 'bg-white text-indigo-600 shadow-sm' : 'text-gray-600'"
                            class="flex-1 py-2 px-4 rounded-md text-sm font-medium transition-all duration-200">
                        Sign In
                    </button>
                    <button @click="authMode = 'signup'" 
                            :class="authMode === 'signup' ? 'bg-white text-indigo-600 shadow-sm' : 'text-gray-600'"
                            class="flex-1 py-2 px-4 rounded-md text-sm font-medium transition-all duration-200">
                        Sign Up
                    </button>
                </div>

                <!-- Sign In Form -->
                <div x-show="authMode === 'signin'" x-transition:enter="transition ease-out duration-300" 
                     x-transition:enter-start="opacity-0 transform translate-y-4" 
                     x-transition:enter-end="opacity-100 transform translate-y-0">
                    <form @submit.prevent="signIn()">
                        <div class="space-y-4">
                            <!-- Auth Input -->
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Phone Number</label>
                                <div class="flex space-x-2">
                                  <div id="signin-cc-picker" class="relative w-28"></div>
                                  <input type="tel" x-model="signinLocal" placeholder="123456789" 
                                         class="flex-1 px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                                         required>
                                </div>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                                <input type="password" x-model="signinPassword" placeholder="Password" autocomplete="current-password"
                                       class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                                       required>
                            </div>
                            <button type="submit" :disabled="loading" 
                                    class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed transition-colors duration-200">
                                <i class="fas fa-spinner fa-spin mr-2" x-show="loading"></i>
                                <span x-show="!loading">Sign In</span>
                                <span x-show="loading">Signing In...</span>
                            </button>
                        </div>
                    </form>
                </div>

                <!-- Sign Up Form -->
                <div x-show="authMode === 'signup'" x-transition:enter="transition ease-out duration-300" 
                     x-transition:enter-start="opacity-0 transform translate-y-4" 
                     x-transition:enter-end="opacity-100 transform translate-y-0">
                    <form @submit.prevent="signUp()">
                        <div class="space-y-4">
                            <!-- Manager Name -->
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Manager Name</label>
                                <div class="flex space-x-2">
                                  <select x-model="signupSalutation" class="w-28 px-2 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                                    <option>MR.</option>
                                    <option>MRS.</option>
                                    <option>MS.</option>
                                    <option>DR.</option>
                                    <option>PROF.</option>
                                  </select>
                                  <input type="text" x-model="signupName" placeholder="Enter your full name" 
                                         class="flex-1 px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                                         required>
                                </div>
                            </div>
                            <!-- Phone Number -->
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Phone Number</label>
                                <div class="flex space-x-2">
                                  <div id="signup-cc-picker" class="relative w-28"></div>
                                  <input type="tel" x-model="signupLocal" placeholder="123456789" 
                                         class="flex-1 px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                                         required>
                                </div>
                            </div>
                            <!-- Password -->
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                                <input type="password" x-model="signupData.password" placeholder="Password" autocomplete="new-password"
                                       class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                                       required>
                            </div>
                            <!-- Hotel Name -->
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Hotel Name</label>
                                <input type="text" x-model="signupData.hotel_name" placeholder="Enter your hotel name" 
                                       class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                                       required>
                            </div>
                            <!-- Role -->
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Role</label>
                                <select x-model="signupData.role" 
                                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                                        required>
                                    <option value="">Select your role</option>
                                    <option value="Hotel Manager">Hotel Manager</option>
                                    <option value="General Manager">General Manager</option>
                                    <option value="Assistant Manager">Assistant Manager</option>
                                    <option value="Front Office Manager">Front Office Manager</option>
                                    <option value="Operations Manager">Operations Manager</option>
                                </select>
                            </div>
                            <!-- Nationality -->
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Nationality</label>
                                <select x-model="signupData.nationality" 
                                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                                    <option value="">Select nationality</option>
                                    <template x-for="n in availableNationalities" :key="n.code">
                                        <option :value="n.name" x-text="n.name"></option>
                                    </template>
                                </select>
                            </div>
                            <!-- Timezone (IANA) -->
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Hotel Timezone (IANA)</label>
                                <div id="tz-picker" class="relative"></div>
                            </div>
                            <!-- Currency (ISO 4217) -->
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Hotel Currency (ISO 4217)</label>
                                <div id="ccy-picker" class="relative"></div>
                            </div>
                            <!-- Languages -->
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Primary Language</label>
                                <select x-model="signupData.primary_language" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                                  <option value="">Select primary language</option>
                                  <template x-for="l in availableLanguages" :key="'p-'+l">
                                      <option :value="l" x-text="l"></option>
                                  </template>
                                </select>
                            </div>
                            <button type="submit" :disabled="loading" 
                                    class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed transition-colors duration-200">
                                <i class="fas fa-spinner fa-spin mr-2" x-show="loading"></i>
                                <span x-show="!loading">Create Account</span>
                                <span x-show="loading">Creating Account...</span>
                            </button>
                        </div>
                    </form>
                </div>

                <!-- Message Display -->
                <div x-show="message" x-transition 
                     :class="messageType === 'success' ? 'bg-green-50 border-green-200 text-green-800' : 'bg-red-50 border-red-200 text-red-800'"
                     class="mt-4 p-3 rounded-md border text-sm">
                    <div class="flex items-center">
                        <i :class="messageType === 'success' ? 'fas fa-check-circle text-green-400' : 'fas fa-exclamation-triangle text-red-400'"
                           class="mr-2"></i>
                        <span x-text="message"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Authentication JavaScript -->
    <script>
        // Place these at the top of the <script> block, before function authApp()
        const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        const apiBase = isLocal ? 'http://localhost:8002/api' : 'https://api.inap.ai/api';

        function authApp() {
            return {
                authMode: 'signin',
                signinCountry: '+60',
                signinLocal: '',
                signinPassword: '',
                signupData: {
                    manager_name: '',
                    manager_phone: '',
                    password: '',
                    hotel_name: '',
                    role: '',
                    nationality: '',
                    hotel_timezone: '',
                    hotel_currency: '',
                    primary_language: ''
                },
                signupCountry: '+60',
                signupLocal: '',
                signupSalutation: 'MR.',
                signupName: '',
                availableLanguages: [],
                availableLanguagesISO: [],
                languageSearch: '',
                availableTimezones: [],
                availableCurrencies: [],
                availableNationalities: [],
                detectedTimezone: '',
                loading: false,
                message: '',
                messageType: 'info',
                countryCodes: [],
                autoDetectedCountryDone: false,

                // Helpers for auto-detect
                getBrowserRegion() {
                    try {
                        const lang = (navigator.language || '').toUpperCase();
                        const m = lang.match(/-([A-Z]{2})$/);
                        return m ? m[1] : '';
                    } catch(_) { return ''; }
                },
                getRegionFromTimezone(tzOverride) {
                    try {
                        const tz = tzOverride || (Intl.DateTimeFormat().resolvedOptions().timeZone || '');
                        const map = {
                            'Asia/Kuala_Lumpur':'MY','Asia/Singapore':'SG','Asia/Bangkok':'TH','Asia/Jakarta':'ID','Asia/Manila':'PH',
                            'Asia/Tokyo':'JP','Asia/Seoul':'KR','Asia/Shanghai':'CN','Asia/Hong_Kong':'HK','Asia/Taipei':'TW','Asia/Ho_Chi_Minh':'VN','Asia/Kolkata':'IN','Asia/Kathmandu':'NP','Asia/Colombo':'LK','Asia/Karachi':'PK','Asia/Dubai':'AE',
                            'Europe/London':'GB','Europe/Paris':'FR','Europe/Berlin':'DE','Europe/Madrid':'ES','Europe/Rome':'IT','Europe/Amsterdam':'NL','Europe/Stockholm':'SE','Europe/Oslo':'NO','Europe/Copenhagen':'DK','Europe/Helsinki':'FI','Europe/Warsaw':'PL','Europe/Moscow':'RU','Europe/Athens':'GR','Europe/Bucharest':'RO','Europe/Sofia':'BG','Europe/Prague':'CZ','Europe/Budapest':'HU','Europe/Vienna':'AT','Europe/Dublin':'IE','Europe/Lisbon':'PT','Europe/Zurich':'CH',
                            'America/New_York':'US','America/Chicago':'US','America/Denver':'US','America/Los_Angeles':'US','America/Toronto':'CA','America/Vancouver':'CA','America/Mexico_City':'MX','America/Sao_Paulo':'BR','America/Argentina/Buenos_Aires':'AR','America/Bogota':'CO','America/Lima':'PE','America/Santiago':'CL',
                            'Africa/Cairo':'EG','Africa/Johannesburg':'ZA','Africa/Nairobi':'KE','Africa/Lagos':'NG','Africa/Casablanca':'MA',
                            'Australia/Sydney':'AU','Australia/Melbourne':'AU','Australia/Perth':'AU','Pacific/Auckland':'NZ','Pacific/Honolulu':'US'
                        };
                        return map[tz] || '';
                    } catch(_) { return ''; }
                },
                regionCurrencyMap: {
                    'US':'USD','GB':'GBP','MY':'MYR','SG':'SGD','ID':'IDR','TH':'THB','VN':'VND','PH':'PHP','CN':'CNY','JP':'JPY','KR':'KRW','AU':'AUD','NZ':'NZD','IN':'INR','AE':'AED','SA':'SAR','FR':'EUR','DE':'EUR','ES':'EUR','IT':'EUR','NL':'EUR','PT':'EUR','SE':'SEK','NO':'NOK','DK':'DKK','FI':'EUR','IE':'EUR','PL':'PLN','RU':'RUB','TR':'TRY','GR':'EUR','RO':'RON','BG':'BGN','UA':'UAH','CZ':'CZK','HU':'HUF','SK':'EUR','SI':'EUR','HR':'EUR','RS':'RSD','BA':'BAM','MK':'MKD','AL':'ALL','LT':'EUR','LV':'EUR','EE':'EUR','IS':'ISK','CA':'CAD','BR':'BRL','AR':'ARS','MX':'MXN'
                },

                async init() {
                    try { this.detectedTimezone = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch(e) { this.detectedTimezone = ''; }
                    if (!this.signupData.hotel_timezone && this.detectedTimezone) {
                        this.signupData.hotel_timezone = this.detectedTimezone;
                    }
                    // Attempt to load full international country calling codes list
                    await this.loadCountryCodes();
                    // Load comprehensive timezones and currencies
                    await this.loadTimezones();
                    await this.loadCurrencies();
                    await this.loadLanguages();
                    await this.loadNationalities();
                    // Auto-detect region and preselect fields
                    try {
                        let region = this.getBrowserRegion() || this.getRegionFromTimezone(this.signupData.hotel_timezone);
                        // Phone country code (override once on first load)
                        if (!this.autoDetectedCountryDone && region) {
                            const hit = (this.countryCodes || []).find(x => x.code === region);
                            if (hit) { this.signinCountry = hit.dial; this.signupCountry = hit.dial; this.autoDetectedCountryDone = true; }
                        }
                        // Nationality defaulted in loadNationalities()
                        // Timezone: already set from detectedTimezone
                        // Currency: set from region map if available
                        if (!this.signupData.hotel_currency) {
                            const cur = this.regionCurrencyMap[region];
                            if (cur) this.signupData.hotel_currency = cur;
                        }
                        // If timezone exists, map it to phone country dial for signup and signin
                        try { this.updateSignupDialFromTimezone(this.signupData.hotel_timezone); this.updateSigninDialFromTimezone(this.signupData.hotel_timezone); } catch(_) {}
                        // Also map nationality and currency from timezone
                        try { this.updateSignupNatAndCcyFromTimezone(this.signupData.hotel_timezone); } catch(_) {}
                    } catch(_) {}
                    // Build typeahead pickers for TZ and Currency
                    try {
                        this.buildTypeaheadPicker('tz-picker', (this.availableTimezonesWithOffsets || this.availableTimezones || []), this.signupData.hotel_timezone || '', (val)=>{ this.signupData.hotel_timezone = val; try{ this.updateSignupDialFromTimezone(val); this.updateSigninDialFromTimezone(val); }catch(_){}});
                        this.buildTypeaheadPicker('ccy-picker', (this.availableCurrenciesWithNames || this.availableCurrencies || []), this.signupData.hotel_currency || '', (val)=>{ this.signupData.hotel_currency = val; });
                        // After pickers mount, refresh both sign-in and signup country dials
                        try { this.updateSigninDialFromTimezone(this.signupData.hotel_timezone); this.updateSignupNatAndCcyFromTimezone(this.signupData.hotel_timezone); } catch(_) {}
                    } catch(_) {}
                    // Watch timezone changes to keep signup phone dial in sync
                    try {
                        this.$watch('signupData.hotel_timezone', (val)=>{ try{ this.updateSignupDialFromTimezone(val); this.updateSigninDialFromTimezone(val); this.updateSignupNatAndCcyFromTimezone(val); }catch(_){}});
                    } catch(_) {}
                },

                updateSignupDialFromTimezone(tz) {
                    try {
                        if (!tz) return;
                        const region = this.getRegionFromTimezone(tz);
                        if (!region) return;
                        const hit = (this.countryCodes || []).find(x => x.code === region);
                        if (!hit || !hit.dial) return;
                        this.signupCountry = hit.dial;
                        // Refresh visible picker label if present
                        const el = document.getElementById('signup-cc-picker');
                        if (el) {
                            const btn = el.querySelector('button');
                            if (btn) {
                                btn.innerHTML = `<span class="cc-entry">${(hit.flag || '')} <span class="cc-code">${region}</span> ${hit.dial}</span>`;
                                try { if (window.twemoji) twemoji.parse(el, {folder: 'svg', ext: '.svg'}); } catch(_) {}
                            }
                        }
                    } catch(_) {}
                },
                updateSigninDialFromTimezone(tz) {
                    try {
                        if (!tz) return;
                        const region = this.getRegionFromTimezone(tz);
                        if (!region) return;
                        const hit = (this.countryCodes || []).find(x => x.code === region);
                        if (!hit || !hit.dial) return;
                        this.signinCountry = hit.dial;
                        // Refresh visible picker label if present
                        const el = document.getElementById('signin-cc-picker');
                        if (el) {
                            const btn = el.querySelector('button');
                            if (btn) {
                                btn.innerHTML = `<span class="cc-entry">${(hit.flag || '')} <span class="cc-code">${region}</span> ${hit.dial}</span>`;
                                try { if (window.twemoji) twemoji.parse(el, {folder: 'svg', ext: '.svg'}); } catch(_) {}
                            }
                        }
                    } catch(_) {}
                },
                updateSignupNatAndCcyFromTimezone(tz) {
                    try {
                        if (!tz) return;
                        const region = this.getRegionFromTimezone(tz);
                        if (!region) return;
                        // Nationality by region code
                        try {
                            const nat = (this.availableNationalities || []).find(x => String(x.code).toUpperCase() === String(region).toUpperCase());
                            if (nat && nat.name) this.signupData.nationality = nat.name;
                        } catch(_) {}
                        // Currency by region map
                        try {
                            const ccy = this.regionCurrencyMap[region];
                            if (ccy) {
                                this.signupData.hotel_currency = ccy;
                                // Refresh currency picker button label if present
                                const el = document.getElementById('ccy-picker');
                                if (el) {
                                    const btn = el.querySelector('button');
                                    if (btn) {
                                        let label = ccy;
                                        try {
                                            const items = this.availableCurrenciesWithNames || [];
                                            const found = items.find(it => (typeof it === 'object' ? it.value : it) === ccy);
                                            if (found) label = (typeof found === 'object') ? (found.label || ccy) : String(found);
                                        } catch(_) {}
                                        btn.textContent = label;
                                    }
                                }
                            }
                        } catch(_) {}
                    } catch(_) {}
                },

                getSigninLabel() {
                    const labels = {
                        phone: 'Phone Number',
                        name: 'Manager Name',
                        hotel: 'Hotel Name'
                    };
                    return labels[this.signinType];
                },

                getSigninPlaceholder() {
                    const placeholders = {
                        phone: '+60123456789',
                        name: 'Enter your full name',
                        hotel: 'Enter your hotel name'
                    };
                    return placeholders[this.signinType];
                },

                showMessage(message, type = 'info') {
                    this.message = message;
                    this.messageType = type;
                    setTimeout(() => {
                        this.message = '';
                    }, 5000);
                },

                fillTestCredentials(type) {
                    const credentials = {
                        phone: '+60187654321',
                        name: 'ALWAFI YAHAYA',
                        hotel: 'Marina Heights'
                    };
                    
                    this.signinType = type;
                    this.signinValue = credentials[type];
                    this.showMessage(`Filled ${type} credentials for testing`, 'success');
                },

                async loadCountryCodes() {
                    // Use hardcoded dataset loaded from js/data/country_codes.js
                    try {
                        if (Array.isArray(window.COUNTRY_CODES) && window.COUNTRY_CODES.length) {
                            this.countryCodes = window.COUNTRY_CODES;
                            // Best-effort default selection from browser locale
                            try {
                                const lang = (navigator.language || '').toUpperCase();
                                const m = lang.match(/-([A-Z]{2})$/);
                                const region = m ? m[1] : '';
                                if (region) {
                                    const hit = this.countryCodes.find(x => x.code === region);
                                    if (hit) { this.signinCountry = hit.dial; this.signupCountry = hit.dial; }
                                }
                            } catch(_) {}
                            // Build custom pickers with visible emojis
                            try {
                                const makePicker = (mountId, modelSetter, currentDial) => {
                                    const el = document.getElementById(mountId);
                                    if (!el) return;
                                    el.innerHTML = '';
                                    const btn = document.createElement('button');
                                    btn.type = 'button';
                                    btn.className = 'w-full border rounded-md px-2 py-2 flex items-center justify-between emoji-text';
                                    const current = this.countryCodes.find(x => x.dial === currentDial) || this.countryCodes[0];
                                    btn.innerHTML = `<span class="cc-entry">${(current?.flag || '')} <span class="cc-code">${current?.code || ''}</span> ${current?.dial || ''}</span>`;
                                    const menu = document.createElement('div');
                                    menu.className = 'absolute mt-1 w-full bg-white border rounded-md shadow z-10 hidden';
                                    const searchWrap = document.createElement('div');
                                    searchWrap.className = 'p-2 border-b bg-white';
                                    const search = document.createElement('input');
                                    search.type = 'text';
                                    search.placeholder = 'Search code or dial';
                                    search.className = 'w-full px-2 py-1 border rounded';
                                    searchWrap.appendChild(search);
                                    const list = document.createElement('div');
                                    list.className = 'max-h-64 overflow-auto';
                                    const renderList = (q) => {
                                        const qq = (q || '').toUpperCase();
                                        list.innerHTML = '';
                                        this.countryCodes.forEach(c => {
                                            try {
                                                const code = String(c?.code || '').toUpperCase();
                                                const dial = String(c?.dial || '').toUpperCase();
                                                if (qq && !(code.includes(qq) || dial.includes(qq))) return;
                                                const item = document.createElement('div');
                                                item.className = 'px-2 py-1 hover:bg-gray-100 cursor-pointer emoji-text';
                                                item.innerHTML = `<span class=\"cc-entry\">${(c?.flag || '')} <span class=\"cc-code\">${code}</span> ${dial}</span>`;
                                                item.onclick = () => {
                                                    modelSetter(c.dial);
                                                    btn.innerHTML = `<span class=\"cc-entry\">${(c?.flag || '')} <span class=\"cc-code\">${code}</span> ${dial}</span>`;
                                                    menu.classList.add('hidden');
                                                    try { if (window.twemoji) twemoji.parse(el, {folder: 'svg', ext: '.svg'}); } catch(_) {}
                                                };
                                                list.appendChild(item);
                                            } catch(_) {}
                                        });
                                    };
                                    renderList('');
                                    search.oninput = () => renderList(search.value);
                                    btn.onclick = () => { 
                                        menu.classList.toggle('hidden'); 
                                        if (!menu.classList.contains('hidden')) { setTimeout(()=>{ try{ search.focus(); }catch(_){}} , 0); }
                                    };
                                    el.appendChild(btn);
                                    menu.appendChild(searchWrap);
                                    menu.appendChild(list);
                                    el.appendChild(menu);
                                    document.addEventListener('click', (e) => {
                                        if (!el.contains(e.target)) menu.classList.add('hidden');
                                    });
                                    // Parse emoji to SVG for cross-platform visibility
                                    try { if (window.twemoji) { twemoji.parse(el, {folder: 'svg', ext: '.svg'}); twemoji.parse(document, {folder: 'svg', ext: '.svg'}); } } catch(_) {}
                                };
                                makePicker('signin-cc-picker', (v)=>{ this.signinCountry = v; }, this.signinCountry || (this.countryCodes[0]?.dial));
                                makePicker('signup-cc-picker', (v)=>{ this.signupCountry = v; }, this.signupCountry || (this.countryCodes[0]?.dial));
                            } catch(_) {}
                            return;
                        }
                    } catch(_) {}
                    this.countryCodes = [];
                },

                async loadTimezones() {
                    try {
                        // Prefer native list if supported
                        if (typeof Intl !== 'undefined' && typeof Intl.supportedValuesOf === 'function') {
                            const tzs = Intl.supportedValuesOf('timeZone') || [];
                            if (tzs && tzs.length) {
                                this.availableTimezones = tzs.sort((a,b)=>a.localeCompare(b));
                                try { this.availableTimezonesWithOffsets = this.availableTimezones.map(tz => ({ value: tz, label: `${this.getTzOffsetLabel(tz)} ${tz}` })); } catch(_) {}
                                // Keep detected timezone if within list
                                if (this.detectedTimezone && !this.availableTimezones.includes(this.detectedTimezone)) {
                                    this.availableTimezones.unshift(this.detectedTimezone);
                                }
                                return;
                            }
                        }
                    } catch(_) {}
                    // Fallback: fetch a curated IANA list
                    try {
                        const res = await fetch('https://cdn.jsdelivr.net/npm/timezones-list@3.0.2/timezones.json');
                        if (res.ok) {
                            const data = await res.json();
                            const tzs = (data || []).map(x => x.tzCode).filter(Boolean);
                            if (tzs.length) {
                                this.availableTimezones = Array.from(new Set(tzs)).sort((a,b)=>a.localeCompare(b));
                                try { this.availableTimezonesWithOffsets = this.availableTimezones.map(tz => ({ value: tz, label: `${this.getTzOffsetLabel(tz)} ${tz}` })); } catch(_) {}
                            }
                        }
                    } catch(_) {}
                },

                async loadCurrencies() {
                    try {
                        if (typeof Intl !== 'undefined' && typeof Intl.supportedValuesOf === 'function') {
                            const currencies = Intl.supportedValuesOf('currency') || [];
                            if (currencies && currencies.length) {
                                this.availableCurrencies = currencies.sort((a,b)=>a.localeCompare(b));
                                try { this.availableCurrenciesWithNames = this.availableCurrencies.map(ccy => ({ value: ccy, label: `${ccy} - ${this.getCurrencyName(ccy)}` })); } catch(_) {}
                                return;
                            }
                        }
                    } catch(_) {}
                    // Fallback: fetch ISO 4217 list
                    try {
                        const res = await fetch('https://cdn.jsdelivr.net/npm/currency-codes/data/codes-all.json');
                        if (res.ok) {
                            const data = await res.json();
                            const set = new Set();
                            (data || []).forEach(x => { if (x && x.code) set.add(String(x.code).toUpperCase()); });
                            const list = Array.from(set).sort((a,b)=>a.localeCompare(b));
                            if (list.length) {
                                this.availableCurrencies = list;
                                try { this.availableCurrenciesWithNames = this.availableCurrencies.map(ccy => ({ value: ccy, label: `${ccy} - ${this.getCurrencyName(ccy)}` })); } catch(_) {}
                            }
                        }
                    } catch(_) {}
                },

                getCurrencySymbol(code) {
                    try {
                        const parts = new Intl.NumberFormat(undefined, { style: 'currency', currency: code }).formatToParts(1);
                        const cur = parts.find(p => p.type === 'currency');
                        return cur ? cur.value : code;
                    } catch(_) { return code; }
                },

                getCurrencyName(code) {
                    try {
                        if (typeof Intl.DisplayNames === 'function') {
                            const dn = new Intl.DisplayNames(undefined, { type: 'currency' });
                            const name = dn.of(code);
                            return name || code;
                        }
                    } catch(_) {}
                    return code;
                },

                getLanguageFlag(name) {
                    try {
                        const key = String(name || '').toLowerCase().trim();
                        return this.languageFlagMap[key] || '';
                    } catch(_) { return ''; }
                },

                getTzOffsetLabel(tz) {
                    try {
                        const parts = new Intl.DateTimeFormat('en-US', { timeZone: tz, timeZoneName: 'short' }).formatToParts(new Date());
                        const tzn = parts.find(p => p.type === 'timeZoneName');
                        let raw = tzn ? String(tzn.value || '') : '';
                        // Normalize e.g., "GMT+8" or "GMT+08:00" to "GMT+08:00"
                        const m = raw.match(/^GMT([+-])(\d{1,2})(?::?(\d{2}))?$/);
                        if (m) {
                            const sign = m[1];
                            const hh = m[2].padStart(2, '0');
                            const mm = (m[3] || '00').padStart(2, '0');
                            return `GMT${sign}${hh}:${mm}`;
                        }
                        if (raw.startsWith('GMT')) return raw;
                        return 'GMT';
                    } catch(_) {
                        return 'GMT';
                    }
                },

                buildTypeaheadPicker(mountId, items, currentValue, onSelect) {
                    const el = document.getElementById(mountId);
                    if (!el) return;
                    el.innerHTML = '';
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'w-full border rounded-md px-2 py-2 flex items-center justify-between';
                    const findLabel = () => {
                        try {
                            for (const it of items || []) {
                                const val = (typeof it === 'string') ? it : it.value;
                                const lab = (typeof it === 'string') ? it : it.label;
                                if (val === currentValue) return lab;
                            }
                        } catch(_) {}
                        return currentValue || 'Select';
                    };
                    btn.textContent = findLabel();
                    const menu = document.createElement('div');
                    menu.className = 'absolute mt-1 w-full bg-white border rounded-md shadow z-10 hidden';
                    const searchWrap = document.createElement('div');
                    searchWrap.className = 'p-2 border-b bg-white';
                    const search = document.createElement('input');
                    search.type = 'text';
                    search.placeholder = 'Type to search';
                    search.className = 'w-full px-2 py-1 border rounded';
                    searchWrap.appendChild(search);
                    const list = document.createElement('div');
                    list.className = 'max-h-64 overflow-auto';
                    const render = (q) => {
                        const qq = (q || '').toUpperCase();
                        list.innerHTML = '';
                        items.forEach(it => {
                            const label = String(it);
                            const val = (typeof it === 'string') ? it : it.value;
                            const lab = (typeof it === 'string') ? it : (it.label || String(val));
                            if (qq && lab.toUpperCase().indexOf(qq) === -1 && String(val).toUpperCase().indexOf(qq) === -1) return;
                            const row = document.createElement('div');
                            row.className = 'px-2 py-1 hover:bg-gray-100 cursor-pointer';
                            row.textContent = lab;
                            row.onclick = () => {
                                btn.textContent = lab;
                                menu.classList.add('hidden');
                                try { if (typeof onSelect === 'function') onSelect(val); } catch(_) {}
                            };
                            list.appendChild(row);
                        });
                    };
                    render('');
                    search.oninput = () => render(search.value);
                    btn.onclick = () => { menu.classList.toggle('hidden'); if (!menu.classList.contains('hidden')) setTimeout(()=>{ try{ search.focus(); }catch(_){}} , 0); };
                    el.appendChild(btn);
                    menu.appendChild(searchWrap);
                    menu.appendChild(list);
                    el.appendChild(menu);
                    document.addEventListener('click', (e) => { if (!el.contains(e.target)) menu.classList.add('hidden'); });
                },

                async loadNationalities() {
                    try {
                        if (Array.isArray(window.COUNTRIES_ISO3166) && window.COUNTRIES_ISO3166.length) {
                            this.availableNationalities = window.COUNTRIES_ISO3166.slice().sort((a,b)=>a.name.localeCompare(b.name));
                        } else {
                            this.availableNationalities = [];
                        }
                    } catch(_) { this.availableNationalities = []; }
                    // Default try: browser region
                    try {
                        const lang = (navigator.language || '').toUpperCase();
                        const m = lang.match(/-([A-Z]{2})$/);
                        const region = m ? m[1] : '';
                        if (region) {
                            const hit = this.availableNationalities.find(x => x.code === region);
                            if (hit) this.signupData.nationality = hit.name;
                        }
                    } catch(_) {}
                },

                async loadLanguages() {
                    try {
                        if (Array.isArray(window.LANGUAGES_ISO639) && window.LANGUAGES_ISO639.length) {
                            this.availableLanguagesISO = window.LANGUAGES_ISO639;
                            this.availableLanguages = window.LANGUAGES_ISO639.map(x => `${x.code.toUpperCase()} - ${x.name}`);
                            return;
                        }
                    } catch(_) {}
                    this.availableLanguagesISO = [ {code:'en',name:'English'} ];
                    this.availableLanguages = ['EN - English'];
                },

                async signIn() {
                    const fullPhone = (this.signinCountry || '') + String(this.signinLocal || '').replace(/\D+/g,'');
                    if (!fullPhone.trim() || !this.signinPassword.trim()) {
                        this.showMessage('Please enter your phone and password', 'error');
                        return;
                    }
                    this.loading = true;
                    try {
                        const response = await fetch(`${apiBase}/auth/signin`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                auth_type: 'phone',
                                auth_value: fullPhone,
                                password: this.signinPassword
                            }),
                            credentials: "include" // <-- REQUIRED for cookies
                        });
                        const data = await response.json();
                        if (data.success) {
                            // No need to store JWT; cookie is set by backend and sent automatically
                            this.showMessage(`Welcome back, ${data.manager_name}!`, 'success');
                            setTimeout(() => {
                                window.location.href = 'index.html';
                            }, 1000);
                        } else {
                            this.showMessage(data.message || 'Invalid credentials', 'error');
                        }
                    } catch (error) {
                        this.showMessage('Sign in failed. Please try again.', 'error');
                    } finally {
                        this.loading = false;
                    }
                },
                async signUp() {
                    const signupPhone = (this.signupCountry || '') + String(this.signupLocal || '').replace(/\D+/g,'');
                    // Prepare combined name early for validation
                    let combinedName = '';
                    try {
                        const nameCore = (this.signupName || this.signupData.manager_name || '').trim();
                        const sal = (this.signupSalutation || '').trim();
                        combinedName = ((sal ? (sal + ' ') : '') + nameCore).trim();
                    } catch(_) { combinedName = this.signupData.manager_name || ''; }
                    // Validate required fields using combined name
                    if (!combinedName || !signupPhone || !this.signupData.password || !this.signupData.hotel_name || !this.signupData.role) {
                        this.showMessage('Please fill in all required fields', 'error');
                        return;
                    }
                    this.signupData.manager_phone = signupPhone;
                    // Set combined name into manager_name for backend compatibility
                    this.signupData.manager_name = combinedName.toUpperCase();
                    // Require primary_language only
                    let primary = (this.signupData.primary_language || '').trim();
                    if (!primary) {
                        try {
                            const sel = document.querySelector('select[x-model="signupData.primary_language"]');
                            if (sel) {
                                const v = (sel.value || '').trim();
                                if (v) primary = v;
                                else if (sel.selectedOptions && sel.selectedOptions[0]) {
                                    const t = (sel.selectedOptions[0].textContent || '').trim();
                                    if (t) primary = t;
                                }
                            }
                        } catch(_) {}
                    }
                    if (!primary) { this.showMessage('Please select primary language', 'error'); return; }
                    this.signupData.primary_language = primary;
                    // Remove secondary languages payload
                    delete this.signupData.preferred_languages;
                    if (!this.signupData.hotel_timezone) {
                        this.showMessage('Please select hotel timezone', 'error');
                        return;
                    }
                    if (!this.signupData.hotel_currency) {
                        this.showMessage('Please select hotel currency', 'error');
                        return;
                    }
                    this.loading = true;
                    try {
                        const response = await fetch(`${apiBase}/auth/signup`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(this.signupData)
                        });
                        const data = await response.json();
                        if (data.success) {
                            this.showMessage('Account created successfully! Please sign in.', 'success');
                            setTimeout(() => {
                                this.authMode = 'signin';
                            }, 1000);
                        } else {
                            this.showMessage(data.message || 'Signup failed', 'error');
                        }
                    } catch (error) {
                        this.showMessage('Sign up failed. Please try again.', 'error');
                    } finally {
                        this.loading = false;
                    }
                }
            }
        }
    </script>
