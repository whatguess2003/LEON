<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Onboarding - LEON-INAP PMS</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    #messages { background-color: #efeae2; background-image: radial-gradient(#e4dcd0 1.2px, transparent 1.2px); background-size: 16px 16px; }
    .wa-action { display: block; width: 100%; background: transparent; border: 0; border-top: 1px solid #e9edef; color: #00a884; padding: 10px 0; font-size: 15px; text-align: center; cursor: pointer; }
    .wa-list { background: #fff; border-radius: 8px; border-bottom-left-radius: 2px; box-shadow: 0 1px 0.5px rgba(11,20,26,.13); max-width: 92%; }
    .wa-list-header { font-weight: 700; font-size: 16px; padding: 8px 10px 0; color: #111b21; }
    .wa-list-body { font-size: 15px; padding: 4px 10px 0; color: #111b21; white-space: pre-wrap; }
    .wa-list-footer { display: flex; justify-content: space-between; font-size: 12px; color: #667781; padding: 6px 10px 8px; }
  </style>
</head>
<body class="h-full bg-white text-gray-900">
  <main id="onboard" class="h-full flex flex-col">
    <header class="border-b border-gray-200 px-4 py-3">
      <div class="max-w-3xl mx-auto flex items-center">
        <div class="w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-sm font-semibold flex-shrink-0">L</div>
        <div class="ml-3">
          <div class="text-sm font-semibold">Leon-INAP</div>
          <div id="progress" class="text-xs text-gray-500">What should I call you?</div>
        </div>
      </div>
    </header>
    <div class="flex-1 flex flex-col md:flex-row min-h-0">
      <section class="flex-1 flex flex-col min-h-0">
        <div id="thread" class="flex-1 min-h-0 relative">
          <div id="messages" class="h-full overflow-y-auto px-4 py-6"></div>
          <div id="onboard-sheet" class="hidden absolute inset-0 flex flex-col justify-end" style="background:rgba(11,20,26,.45);z-index:6">
            <div class="bg-white flex flex-col" style="max-height:78%;border-top-left-radius:16px;border-top-right-radius:16px">
              <div class="relative py-3 border-b flex-shrink-0">
                <div id="onboard-sheet-title" class="text-center text-sm font-semibold"></div>
                <button id="onboard-sheet-close" type="button" class="absolute right-3 top-2 w-8 h-8 rounded-full" style="background:#f0f2f5;color:#54656f">×</button>
              </div>
              <div id="onboard-sheet-rows" class="overflow-y-auto"></div>
              <div class="text-center text-xs py-3 flex-shrink-0" style="color:#8696a0">Tap an item to select it</div>
            </div>
          </div>
        </div>
        <form id="composer" class="border-t border-gray-200 px-4 py-3">
          <div id="suggestion-row" class="max-w-3xl mx-auto mb-2"></div>
          <div id="composer-row" class="max-w-3xl mx-auto flex items-end">
            <textarea id="input" rows="1" placeholder="Message LEON-INAP" class="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm resize-none max-h-40"></textarea>
            <button id="send" type="submit" class="ml-2 bg-blue-600 text-white rounded-lg px-4 py-2 text-sm flex-shrink-0">Send</button>
          </div>
        </form>
      </section>
      <aside id="guide" class="w-full md:w-64 border-t md:border-t-0 md:border-l border-gray-200 p-3 overflow-y-auto order-first md:order-last flex-shrink-0">
        <h2 class="text-xs font-semibold text-gray-700">To-do</h2>
        <div id="todos" class="mt-2"></div>
        <h2 class="text-xs font-semibold text-gray-700 mt-4">Highlights</h2>
        <div id="highlights" class="mt-2"></div>
      </aside>
    </div>
  </main>
  <script src="js/components/onboard.js?v=otp"></script>
</body>
<script src="js/subpage-embed.js"></script>
</html>
