<!DOCTYPE html>
<html lang="en">
<head>
    <script src="js/session.js?v=hotel"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OTA Mapping - LEON PMS</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100">
  <main class="max-w-5xl mx-auto px-4 py-6">
    <h1 class="text-2xl font-bold text-gray-900 mb-1">OTA Mapping</h1>
    <div id="ota-hotel" class="text-sm text-gray-600 mb-4">Hotel: -</div>

    <div class="bg-white border rounded shadow-sm mb-4 p-3">
      <label class="block text-sm">
        <span class="block text-gray-600 mb-1">Aiosell hotel code</span>
        <input id="ota-hotel-code" class="border rounded px-3 py-2 w-full" placeholder="sandbox-pms" />
      </label>
      <div id="ota-status" class="text-sm text-gray-600 mt-2"></div>
    </div>

    <div class="bg-white border rounded shadow-sm">
      <div class="flex items-center justify-between px-4 py-3 border-b">
        <div>
          <div class="text-lg font-medium text-gray-800">Configure</div>
          <div id="ota-property" class="text-xs text-gray-500"></div>
        </div>
        <div class="flex items-center space-x-2">
          <button id="ota-logs-new" type="button" class="px-3 py-1 text-sm border border-blue-500 text-blue-600 rounded bg-white">Logs (New)</button>
          <button id="ota-logs" type="button" class="px-3 py-1 text-sm border border-blue-500 text-blue-600 rounded bg-white">Logs</button>
          <button id="ota-submit" type="button" class="px-4 py-1 text-sm bg-blue-600 text-white rounded">Submit</button>
        </div>
      </div>
      <div id="ota-log-panel" class="hidden border-b bg-gray-50 px-4 py-3 text-xs text-gray-700"></div>
      <div id="ota-tabs" class="flex overflow-x-auto border-b"></div>
      <div id="ota-res-out" class="hidden border-b"></div>
      <div id="ota-rows"></div>
      <div id="ota-rooms-wrap" class="hidden border-t">
        <div class="px-4 py-3 border-b text-sm font-medium text-gray-800">Room and rate plan mapping</div>
        <div id="ota-rooms" class="px-4"></div>
      </div>
      <div class="py-6 text-center">
        <button id="ota-add" type="button" class="px-4 py-2 text-sm bg-blue-600 text-white rounded">Add New Mapping</button>
      </div>
    </div>
  </main>
  <script src="js/components/ota_mapping.js?v=hotel"></script>
</body>
</html>
